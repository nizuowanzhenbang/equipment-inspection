name: Quality checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx ruff
      - name: Check Python syntax and undefined names
        run: python -m ruff check backend --select E9,F63,F7,F82
      - name: Regression tests
        run: cd backend && python -m pytest tests -q
      - name: Interview scenario evidence
        run: cd backend && python interview_demo.py
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCHEDULER_ENABLED: 'false'
      TEST_POSTGRESQL_URL: postgresql+psycopg2://portfolio_test:isolated_ci_password@127.0.0.1:5432/portfolio_test
      PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE: /usr/lib/postgresql/16/bin/pg_restore
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_test -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application, test and PostgreSQL dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r backend/requirements-postgres.txt
      - name: Install matching PostgreSQL backup clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: PostgreSQL transaction regression tests
        run: cd backend && python -m pytest tests/postgresql -q --junitxml=postgresql-results.xml
      - name: Preserve PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-regression-results
          path: backend/postgresql-results.xml
          if-no-files-found: warn
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and production build
        run: npm run build
      - name: Offline queue regression tests
        run: npm test
