name: Compose browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ei-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked browser dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and start with fresh project volumes
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check liveness and database readiness
        run: |
          curl --fail --silent http://127.0.0.1:8003/health
          curl --fail --silent http://127.0.0.1:8003/ready
      - name: Chromium login and authorization acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve container diagnostics
        if: always()
        run: |
          mkdir -p deployment-results
          docker compose ps --all > deployment-results/containers.txt
          docker compose logs --no-color > deployment-results/compose.log
      - name: Reject credentials in request logs
        if: success()
        run: |
          if grep -qE 'token=|admin123|viewer123|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.' deployment-results/compose.log; then
            echo "Unexpected credential material in container logs"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            deployment-results/
          retention-days: 14
      - name: Remove only this CI project's disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
