# Local synthetic demo only. Public sample credentials; never use for production.
# Run with an explicit unique project name to isolate data and cleanup.
services:
  backend:
    build: ./backend
    environment:
      APP_MODE: demo
      DATABASE_URL: postgresql+psycopg2://eq:eqpass@postgres:5432/equipment_inspection
      SECRET_KEY: change-me-in-production
      DEBUG: "false"
      SAFETY_SYSTEM_URL: ""
      INTEGRATION_SECRET: coal-integration-shared-secret
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-equipment-inspection}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: "true"
      PROCUREMENT_SYSTEM_URL: ""
      PROCUREMENT_INTEGRATION_TOKEN: coal-integration-shared-secret
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8003}:8003"
    volumes:
      - eq_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: eq
      POSTGRES_PASSWORD: eqpass
      POSTGRES_DB: equipment_inspection
    volumes:
      - eq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eq -d equipment_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  eq_uploads:
  eq_pgdata:
